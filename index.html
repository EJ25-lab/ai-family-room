<style>
  /* ============ AI FAMILY ROOM — EJC clean & light ============ */
  :root { --afr-scale: 1; --afr-max: 1100px; }
  html { scroll-behavior: smooth; scroll-padding-top: 86px; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--ejc-white);
    color: var(--ejc-text);
    font-family: var(--font-sans);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  #root { overflow-x: clip; }
  a { color: inherit; }
  ::selection { background: var(--ejc-teal-pale); }

  .afr-wrap { max-width: var(--afr-max); margin: 0 auto; padding: 0 40px; width: 100%; box-sizing: border-box; }

  /* ---------- NAV ---------- */
  .afr-nav {
    position: sticky; top: 0; z-index: 60;
    background: rgba(255,255,255,.88);
    backdrop-filter: saturate(140%) blur(10px);
    border-bottom: 1px solid var(--ejc-warm);
  }
  .afr-nav-inner { display: flex; align-items: center; gap: 18px; height: 70px; }
  .afr-logo { display: flex; align-items: center; gap: 12px; text-decoration: none; flex-shrink: 0; }
  .afr-mark {
    width: 42px; height: 42px; border-radius: var(--radius-md);
    background: var(--ejc-teal); color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 15px; letter-spacing: .02em; flex-shrink: 0;
  }
  .afr-logo-name { display: block; font-weight: 800; font-size: 16px; letter-spacing: -.01em; color: var(--ejc-text); line-height: 1.1; }
  .afr-logo-sub { display: block; font-size: 10.5px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--ejc-teal); margin-top: 3px; }
  .afr-nav-links { display: flex; align-items: center; gap: 4px; list-style: none; margin: 0 0 0 auto; padding: 0; }
  .afr-nav-links > li { position: relative; }
  .afr-nav-links a {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 14px; font-weight: 600; color: var(--ejc-mid); text-decoration: none;
    padding: 9px 12px; border-radius: var(--radius-pill);
    transition: color var(--dur-base) var(--ease-standard), background var(--dur-base) var(--ease-standard);
  }
  .afr-nav-links a:hover { color: var(--ejc-teal-deep); background: var(--ejc-teal-pale); }
  .afr-caret { font-size: 9px; opacity: .7; transition: transform var(--dur-base) var(--ease-standard); }
  .afr-dd { position: relative; }
  .afr-dd-menu {
    position: absolute; top: calc(100% + 6px); left: 0; min-width: 230px;
    background: #fff; border: 1px solid var(--ejc-warm); border-radius: var(--radius-md);
    box-shadow: var(--shadow-raised); padding: 8px; list-style: none; margin: 0;
    opacity: 0; visibility: hidden; transform: translateY(-6px);
    transition: opacity var(--dur-base) var(--ease-standard), transform var(--dur-base) var(--ease-standard), visibility var(--dur-base);
  }
  .afr-dd:hover .afr-dd-menu, .afr-dd:focus-within .afr-dd-menu { opacity: 1; visibility: visible; transform: translateY(0); }
  .afr-dd:hover .afr-caret { transform: rotate(180deg); }
  .afr-dd-menu a { display: block; width: 100%; box-sizing: border-box; }
  .afr-nav-cta {
    flex-shrink: 0; margin-left: 8px;
    background: var(--ejc-teal); color: #fff !important;
    font-weight: 700; font-size: 14px; padding: 11px 20px; border-radius: var(--radius-pill);
    text-decoration: none;
    transition: background var(--dur-base) var(--ease-standard), transform var(--dur-fast) var(--ease-standard);
  }
  .afr-nav-cta:hover { background: var(--ejc-teal-dark) !important; transform: translateY(-1px); }
  .afr-burger { display: none; flex-direction: column; gap: 5px; width: 44px; height: 44px; align-items: center; justify-content: center; background: none; border: none; cursor: pointer; margin-left: auto; }
  .afr-burger span { width: 22px; height: 2px; background: var(--ejc-text); border-radius: 2px; transition: transform var(--dur-base) var(--ease-standard), opacity var(--dur-base); }
  .afr-burger.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
  .afr-burger.open span:nth-child(2) { opacity: 0; }
  .afr-burger.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

  .afr-drawer {
    position: fixed; top: 70px; left: 0; right: 0; bottom: 0; z-index: 55;
    background: #fff; padding: 18px 28px 40px; overflow-y: auto;
    display: none; flex-direction: column; gap: 2px;
  }
  .afr-drawer.open { display: flex; }
  .afr-drawer a { font-size: 17px; font-weight: 600; color: var(--ejc-text); text-decoration: none; padding: 14px 4px; border-bottom: 1px solid var(--ejc-warm); }
  .afr-drawer .afr-drawer-label { font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--ejc-light); padding: 18px 4px 6px; border: none; }
  .afr-drawer .afr-nav-cta { display: inline-block; margin: 20px 0 0; text-align: center; }

  /* ---------- SECTIONS ---------- */
  .afr-sect { padding: 92px 0; }
  .afr-sect.tight { padding: 72px 0; }
  .afr-sect.off { background: var(--ejc-off); }
  .afr-sect.pale { background: var(--ejc-teal-pale); }
  .afr-sect-head { max-width: 720px; margin-bottom: 40px; }
  .afr-eyebrow { font-size: 11.5px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; color: var(--ejc-teal); margin: 0 0 14px; }
  .afr-h2 { font-size: calc(2.1rem * var(--afr-scale)); font-weight: 800; letter-spacing: -.02em; line-height: 1.12; margin: 0; color: var(--ejc-text); text-wrap: balance; }
  .afr-h2 .accent { color: var(--ejc-teal); }
  .afr-sub { font-size: calc(18px * var(--afr-scale)); line-height: 1.65; color: var(--ejc-mid); margin: 16px 0 0; max-width: 60ch; }

  /* ---------- HERO ---------- */
  .afr-hero { padding: 88px 0 84px; }
  .afr-hero-grid { display: grid; grid-template-columns: 1fr; gap: 56px; align-items: center; }
  .afr-hero-grid.split { grid-template-columns: 1.15fr .85fr; }
  .afr-brandbar { display: flex; align-items: center; gap: 14px; margin-bottom: 28px; }
  .afr-brandbar img { height: 44px; width: auto; }
  .afr-brandbar .rule { width: 1px; height: 34px; background: var(--ejc-warm); }
  .afr-brandbar .meta { font-size: 10.5px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--ejc-teal); line-height: 1.5; }
  .afr-brandbar .meta small { display: block; font-size: 9.5px; letter-spacing: .12em; color: var(--ejc-light); font-weight: 600; }
  .afr-hero h1 {
    font-size: calc(clamp(2.4rem, 5vw, 3.7rem) * var(--afr-scale));
    font-weight: 800; letter-spacing: -.025em; line-height: 1.07; margin: 0 0 24px;
    color: var(--ejc-text); text-wrap: balance;
  }
  .afr-hero h1 .accent { color: var(--ejc-teal); }
  .afr-hero-sub { font-size: calc(19px * var(--afr-scale)); line-height: 1.6; color: var(--ejc-mid); margin: 0 0 32px; max-width: 52ch; }
  .afr-hero-sub strong { color: var(--ejc-text); font-weight: 700; }
  .afr-btn-row { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; }
  .afr-status { display: inline-flex; align-items: center; gap: 9px; margin-top: 28px; font-size: 13.5px; font-weight: 600; color: var(--ejc-mid); }
  .afr-status .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--ejc-teal); position: relative; flex-shrink: 0; }
  .afr-status .dot::after { content: ''; position: absolute; inset: -5px; border-radius: 50%; border: 1.5px solid var(--ejc-teal); opacity: .4; }

  /* hero visual panel (split layout) */
  .afr-hero-panel {
    background: var(--ejc-teal-pale); border-radius: var(--radius-lg);
    border: 1px solid #cdeeeb; padding: 38px 36px; position: relative;
  }
  .afr-hero-panel .panel-mark { width: 64px; height: 64px; border-radius: var(--radius-md); background: var(--ejc-teal); display: flex; align-items: center; justify-content: center; margin-bottom: 22px; }
  .afr-hero-panel .panel-mark img { width: 64px; height: 64px; border-radius: var(--radius-md); display: block; }
  .afr-hero-panel .panel-q { font-size: calc(1.18rem * var(--afr-scale)); font-weight: 700; line-height: 1.4; color: var(--ejc-teal-deep); margin: 0 0 18px; }
  .afr-hero-panel .panel-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
  .afr-hero-panel .panel-list li { position: relative; padding-left: 24px; font-size: 14.5px; font-weight: 600; color: var(--ejc-teal-deep); line-height: 1.5; }
  .afr-hero-panel .panel-list li::before { content: ''; position: absolute; left: 4px; top: 7px; width: 8px; height: 8px; border-radius: 50%; background: var(--ejc-teal); }

  /* ---------- CHIEF NOTE ---------- */
  .afr-chief { max-width: 760px; }
  .afr-chief .afr-h2 { margin-bottom: 8px; }
  .afr-chief-body { font-size: calc(18px * var(--afr-scale)); line-height: 1.78; color: var(--ejc-mid); }
  .afr-chief-body p { margin: 0 0 18px; }
  .afr-chief-body strong { color: var(--ejc-text); font-weight: 700; }
  .afr-sign { margin-top: 32px; padding-top: 22px; border-top: 1px solid var(--ejc-warm); }
  .afr-sign-name { font-size: 16px; font-weight: 700; color: var(--ejc-teal-deep); }
  .afr-sign-role { font-size: 13px; color: var(--ejc-light); margin-top: 3px; }
  .afr-textlink { display: inline-flex; align-items: center; gap: 7px; margin-top: 26px; font-size: 14.5px; font-weight: 700; color: var(--ejc-teal-deep); text-decoration: none; border-bottom: 1.5px solid var(--ejc-teal); padding-bottom: 2px; }
  .afr-textlink:hover { color: var(--ejc-teal-dark); }

  /* ---------- TRACKS ---------- */
  .afr-track-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
  .afr-track {
    display: flex; flex-direction: column; gap: 0; text-decoration: none;
    background: #fff; border: 1px solid var(--ejc-warm); border-radius: var(--radius-md);
    padding: 24px 24px 22px; box-shadow: var(--shadow-card);
    transition: transform var(--dur-base) var(--ease-standard), box-shadow var(--dur-base) var(--ease-standard), border-color var(--dur-base);
  }
  .afr-track:hover { transform: translateY(-3px); box-shadow: var(--shadow-raised); border-color: #cdeeeb; }
  .afr-track-marker { width: 22px; height: 22px; border-radius: var(--radius-sm); background: var(--ejc-teal); margin-bottom: 18px; }
  .afr-track-eyebrow { font-size: 10.5px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--ejc-teal); margin-bottom: 8px; }
  .afr-track-name { font-size: calc(1.18rem * var(--afr-scale)); font-weight: 700; color: var(--ejc-text); letter-spacing: -.01em; line-height: 1.2; margin-bottom: 8px; }
  .afr-track-note { font-size: 14px; line-height: 1.55; color: var(--ejc-mid); margin: 0 0 16px; }
  .afr-track-meta { margin-top: auto; font-size: 12.5px; font-weight: 700; letter-spacing: .03em; color: var(--ejc-teal-deep); }
  .afr-track-foot { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; margin-top: 30px; }
  .afr-track-foot .small { font-size: 14px; color: var(--ejc-light); }
  .afr-track-foot .small a { color: var(--ejc-teal-deep); text-decoration: underline; text-underline-offset: 3px; font-weight: 600; }

  /* ---------- ARTIFACTS / TOOLS GRID ---------- */
  .afr-grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
  .afr-tool {
    display: flex; flex-direction: column; text-decoration: none;
    background: #fff; border: 1px solid var(--ejc-warm); border-radius: var(--radius-md);
    padding: 26px 26px 24px; box-shadow: var(--shadow-card);
    transition: transform var(--dur-base) var(--ease-standard), box-shadow var(--dur-base) var(--ease-standard), border-color var(--dur-base);
  }
  .afr-tool:hover { transform: translateY(-3px); box-shadow: var(--shadow-raised); border-color: #cdeeeb; }
  .afr-tool.featured { border-color: var(--ejc-teal); box-shadow: 0 0 0 1px var(--ejc-teal), var(--shadow-card); }
  .afr-tool-eyebrow { font-size: 10.5px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--ejc-teal); margin-bottom: 10px; }
  .afr-tool-name { font-size: calc(1.28rem * var(--afr-scale)); font-weight: 800; color: var(--ejc-text); letter-spacing: -.01em; margin-bottom: 10px; }
  .afr-tool-desc { font-size: 14.5px; line-height: 1.6; color: var(--ejc-mid); margin: 0 0 18px; }
  .afr-tool-cta { margin-top: auto; font-size: 13.5px; font-weight: 700; color: var(--ejc-teal-deep); }
  .afr-tool:hover .afr-tool-cta { color: var(--ejc-teal-dark); }

  /* ---------- SIDE-KICK (live class) ---------- */
  .afr-sk-head { max-width: 760px; }
  .afr-sk-chips { display: flex; flex-wrap: wrap; gap: 10px; margin: 26px 0 36px; }
  .afr-chip { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 600; padding: 9px 15px; border-radius: var(--radius-pill); }
  .afr-cohorts { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; max-width: 760px; }
  .afr-cohort { border-radius: var(--radius-lg); padding: 26px 26px; }
  .afr-cohort-kicker { font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; margin-bottom: 7px; }
  .afr-cohort-time { font-size: calc(1.32rem * var(--afr-scale)); font-weight: 800; letter-spacing: -.01em; margin-bottom: 20px; }
  .afr-cohort-btn { display: flex; align-items: center; justify-content: center; gap: 8px; font-weight: 700; text-decoration: none; border-radius: var(--radius-pill); transition: background var(--dur-base) var(--ease-standard), transform var(--dur-fast) var(--ease-standard), border-color var(--dur-base), color var(--dur-base); }
  .afr-cohort-series { font-size: 14.5px; padding: 14px 18px; margin-bottom: 10px; }
  .afr-cohort-drop { font-size: 13.5px; padding: 12px 18px; }
  .afr-cohort-btn:hover { transform: translateY(-2px); }
  .afr-sk-note { font-size: 14px; line-height: 1.7; margin: 26px 0 0; max-width: 620px; }
  .afr-sk-note a { font-weight: 700; text-decoration: none; border-bottom: 1px solid currentColor; }

  /* Live band — LIGHT (default, brand-compliant) */
  .afr-sk.light { background: var(--ejc-teal-pale); }
  .afr-sk.light .afr-eyebrow { color: var(--ejc-teal-deep); }
  .afr-sk.light .afr-h2 { color: var(--ejc-text); }
  .afr-sk.light .afr-h2 .accent { color: var(--ejc-teal-deep); }
  .afr-sk.light .afr-sub { color: var(--ejc-mid); }
  .afr-sk.light .afr-chip { background: #fff; color: var(--ejc-teal-deep); border: 1px solid #cdeeeb; }
  .afr-sk.light .afr-cohort { background: #fff; border: 1px solid #cdeeeb; box-shadow: var(--shadow-card); }
  .afr-sk.light .afr-cohort-kicker { color: var(--ejc-teal-deep); }
  .afr-sk.light .afr-cohort-time { color: var(--ejc-text); }
  .afr-sk.light .afr-cohort-series { background: var(--ejc-teal); color: #fff; }
  .afr-sk.light .afr-cohort-series:hover { background: var(--ejc-teal-dark); }
  .afr-sk.light .afr-cohort-drop { background: transparent; color: var(--ejc-teal-deep); border: 1.5px solid var(--ejc-teal); }
  .afr-sk.light .afr-cohort-drop:hover { background: var(--ejc-teal-pale); }
  .afr-sk.light .afr-sk-note { color: var(--ejc-mid); }
  .afr-sk.light .afr-sk-note strong { color: var(--ejc-text); }
  .afr-sk.light .afr-sk-note a { color: var(--ejc-teal-deep); }

  /* Live band — DARK (optional direction) */
  .afr-sk.dark { background: var(--ejc-dark); }
  .afr-sk.dark .afr-eyebrow { color: var(--ejc-teal); }
  .afr-sk.dark .afr-h2 { color: #fff; }
  .afr-sk.dark .afr-h2 .accent { color: var(--ejc-teal); }
  .afr-sk.dark .afr-sub { color: rgba(255,255,255,.72); }
  .afr-sk.dark .afr-chip { background: rgba(255,255,255,.06); color: rgba(255,255,255,.85); border: 1px solid rgba(255,255,255,.12); }
  .afr-sk.dark .afr-cohort { background: #111A1E; border: 1px solid rgba(255,255,255,.09); }
  .afr-sk.dark .afr-cohort-kicker { color: var(--ejc-teal); }
  .afr-sk.dark .afr-cohort-time { color: #fff; }
  .afr-sk.dark .afr-cohort-series { background: var(--ejc-teal); color: var(--ejc-dark); }
  .afr-sk.dark .afr-cohort-series:hover { background: var(--ejc-teal-dark); }
  .afr-sk.dark .afr-cohort-drop { background: transparent; color: #fff; border: 1.5px solid rgba(255,255,255,.24); }
  .afr-sk.dark .afr-cohort-drop:hover { border-color: var(--ejc-teal); color: var(--ejc-teal); }
  .afr-sk.dark .afr-sk-note { color: rgba(255,255,255,.6); }
  .afr-sk.dark .afr-sk-note strong { color: #fff; }
  .afr-sk.dark .afr-sk-note a { color: var(--ejc-teal); }

  /* ---------- LEADERS ---------- */
  .afr-leaders-grid { display: grid; grid-template-columns: 1.2fr .8fr; gap: 48px; align-items: center; }
  .afr-leaders-grid .afr-sub { margin-top: 18px; }
  .afr-leaders-actions { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 28px; }
  .afr-leaders-aside { background: #fff; border: 1px solid var(--ejc-warm); border-radius: var(--radius-lg); padding: 28px 30px; box-shadow: var(--shadow-card); }
  .afr-leaders-aside .q { font-size: 15px; font-weight: 700; color: var(--ejc-teal-deep); line-height: 1.5; margin: 0 0 6px; }
  .afr-leaders-aside .a { font-size: 13.5px; color: var(--ejc-mid); line-height: 1.55; margin: 0 0 18px; }
  .afr-leaders-aside .a:last-child { margin-bottom: 0; }

  /* ---------- FAQ ---------- */
  .afr-faq { max-width: 800px; }
  .afr-faq details { border-bottom: 1px solid var(--ejc-warm); }
  .afr-faq summary { list-style: none; cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 18px; padding: 22px 2px; font-size: calc(1.05rem * var(--afr-scale)); font-weight: 700; color: var(--ejc-text); }
  .afr-faq summary::-webkit-details-marker { display: none; }
  .afr-faq summary .pm { width: 26px; height: 26px; flex-shrink: 0; color: var(--ejc-teal); font-size: 20px; font-weight: 400; display: flex; align-items: center; justify-content: center; transition: transform var(--dur-base) var(--ease-standard); }
  .afr-faq details[open] summary .pm { transform: rotate(45deg); }
  .afr-faq-body { padding: 0 2px 24px; font-size: 15px; line-height: 1.7; color: var(--ejc-mid); max-width: 64ch; }
  .afr-faq-body a { color: var(--ejc-teal-deep); font-weight: 600; }

  /* ---------- PASS ALONG ---------- */
  .afr-pass-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; align-items: center; }
  .afr-pass-card {
    background: var(--ejc-teal); border-radius: var(--radius-lg); padding: 44px 42px; color: #fff;
    box-shadow: var(--shadow-raised);
  }
  .afr-pass-card .ey { font-size: 11px; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; color: rgba(255,255,255,.8); }
  .afr-pass-card .hl { font-size: calc(2.2rem * var(--afr-scale)); font-weight: 800; letter-spacing: -.02em; margin: 14px 0 6px; }
  .afr-pass-card .url { font-size: 17px; font-weight: 700; color: #effbfa; }
  .afr-pass-card .tag { font-size: 14px; line-height: 1.6; color: rgba(255,255,255,.85); margin: 18px 0 0; }
  .afr-pass-card .handle { display: inline-block; margin-top: 20px; font-size: 13px; font-weight: 700; color: rgba(255,255,255,.92); }
  .afr-pass-actions { display: flex; flex-direction: column; align-items: flex-start; gap: 14px; }
  .afr-copybtn { font-family: var(--font-sans); cursor: pointer; border: none; background: var(--ejc-teal); color: #fff; font-weight: 700; font-size: 15px; padding: 15px 26px; border-radius: var(--radius-pill); transition: background var(--dur-base) var(--ease-standard), transform var(--dur-fast) var(--ease-standard); }
  .afr-copybtn:hover { background: var(--ejc-teal-dark); transform: translateY(-1px); }

  /* ---------- ANCHOR PILLS ---------- */
  .afr-pills { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 26px; }
  .afr-pill-link { display: inline-flex; align-items: center; gap: 7px; font-size: 13.5px; font-weight: 700; color: var(--ejc-teal-deep); text-decoration: none; background: var(--ejc-teal-pale); border: 1px solid #cdeeeb; padding: 9px 16px; border-radius: var(--radius-pill); transition: background var(--dur-base) var(--ease-standard), transform var(--dur-fast) var(--ease-standard); }
  .afr-pill-link:hover { background: #cdeeeb; transform: translateY(-1px); }

  /* ---------- BENTO HUB ---------- */
  .afr-bento { display: grid; grid-template-columns: repeat(6, 1fr); grid-auto-rows: minmax(170px, auto); gap: 16px; }
  .afr-bento-card { position: relative; display: flex; flex-direction: column; background: #fff; border: 1px solid var(--ejc-warm); border-radius: var(--radius-lg); padding: 28px; box-shadow: var(--shadow-card); text-decoration: none; transition: transform var(--dur-base) var(--ease-standard), box-shadow var(--dur-base) var(--ease-standard), border-color var(--dur-base); }
  a.afr-bento-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-raised); border-color: #cdeeeb; }
  .afr-bento-card .be { font-size: 10.5px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--ejc-teal); margin: 0 0 10px; }
  .afr-bento-card .bt { font-size: calc(1.34rem * var(--afr-scale)); font-weight: 800; letter-spacing: -.01em; line-height: 1.18; color: var(--ejc-text); margin: 0 0 10px; }
  .afr-bento-card .bd { font-size: 14.5px; line-height: 1.6; color: var(--ejc-mid); margin: 0; }
  .afr-bento-card .bcta { margin-top: auto; padding-top: 18px; font-size: 13.5px; font-weight: 700; color: var(--ejc-teal-deep); }
  a.afr-bento-card:hover .bcta { color: var(--ejc-teal-dark); }

  .afr-bento-card .blist li { font-size: 12.5px; font-weight: 600; color: var(--ejc-teal-deep); background: var(--ejc-teal-pale); border-radius: var(--radius-pill); padding: 5px 12px; }
  .bento-a { grid-column: span 4; grid-row: span 2; background: var(--ejc-teal-pale); border-color: #cdeeeb; }
  .bento-a .bt { font-size: calc(1.95rem * var(--afr-scale)); max-width: 17ch; }
  .bento-a .bd { font-size: 16px; color: var(--ejc-teal-deep); max-width: 46ch; }
  .bento-a-actions { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; margin-top: auto; padding-top: 22px; }
  .bento-b, .bento-c, .bento-d, .bento-e, .bento-f { grid-column: span 2; }
  .bento-f { background: var(--ejc-teal); border-color: var(--ejc-teal); }
  .bento-f .be { color: rgba(255,255,255,.82); }
  .bento-f .bt { color: #fff; }
  .bento-f .bd { color: rgba(255,255,255,.9); }
  .bento-f .bcta { color: #fff; }

  /* ---------- CLOSING (faq + share + leaders) ---------- */
  .afr-closing-grid { display: grid; grid-template-columns: 1fr .9fr; gap: 48px; align-items: start; }
  .afr-closing-right { display: flex; flex-direction: column; gap: 20px; }
  .afr-closing-right .afr-pass-card { padding: 34px 32px; }
  .afr-closing-right .afr-pass-card .hl { font-size: calc(1.9rem * var(--afr-scale)); }
  .afr-leaders-mini { border-top: 1px solid var(--ejc-warm); padding-top: 22px; }
  .afr-leaders-mini .q { font-size: 15px; font-weight: 700; color: var(--ejc-text); margin: 0 0 6px; }
  .afr-leaders-mini .a { font-size: 13.5px; color: var(--ejc-mid); line-height: 1.55; margin: 0 0 16px; }
  .afr-leaders-mini-actions { display: flex; flex-wrap: wrap; gap: 12px; }

  /* ---------- FOOTER ---------- */
  .afr-footer { background: var(--ejc-off); border-top: 1px solid var(--ejc-warm); padding: 64px 0 40px; }
  .afr-footer-grid { display: grid; grid-template-columns: 1.6fr 1fr 1fr; gap: 40px; }
  .afr-footer-logo { font-size: 17px; font-weight: 800; color: var(--ejc-text); }
  .afr-footer-tag { font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--ejc-teal); display: block; margin-top: 4px; }
  .afr-footer-about { font-size: 13.5px; line-height: 1.65; color: var(--ejc-mid); margin: 16px 0 0; max-width: 42ch; }
  .afr-footer-col-title { font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--ejc-light); }
  .afr-footer-links { list-style: none; margin: 14px 0 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  .afr-footer-links a { font-size: 14px; color: var(--ejc-mid); text-decoration: none; }
  .afr-footer-links a:hover { color: var(--ejc-teal-deep); }
  .afr-footer-privacy { font-size: 12.5px; line-height: 1.6; color: var(--ejc-light); margin: 36px 0 0; max-width: 80ch; }
  .afr-footer-privacy a { color: var(--ejc-teal-deep); font-weight: 600; }

  /* ---------- RESPONSIVE ---------- */
  @media (max-width: 940px) {
    .afr-nav-links { display: none; }
    .afr-nav-cta { display: none; }
    .afr-burger { display: flex; }
    .afr-hero-grid.split { grid-template-columns: 1fr; }
    .afr-hero-panel { display: none; }
    .afr-track-grid { grid-template-columns: 1fr 1fr; }
    .afr-grid-3 { grid-template-columns: 1fr; }
    .afr-leaders-grid { grid-template-columns: 1fr; gap: 32px; }
    .afr-pass-grid { grid-template-columns: 1fr; gap: 28px; }
    .afr-footer-grid { grid-template-columns: 1fr 1fr; }
    .afr-bento { grid-template-columns: repeat(2, 1fr); }
    .bento-a { grid-column: span 2; grid-row: auto; }
    .bento-b, .bento-c, .bento-d, .bento-e { grid-column: span 1; }
    .bento-f { grid-column: span 2; }
    .afr-closing-grid { grid-template-columns: 1fr; gap: 36px; }
  }
  @media (max-width: 620px) {
    .afr-wrap { padding: 0 22px; }
    .afr-sect { padding: 64px 0; }
    .afr-hero { padding: 56px 0; }
    .afr-track-grid { grid-template-columns: 1fr; }
    .afr-cohorts { grid-template-columns: 1fr; }
    .afr-footer-grid { grid-template-columns: 1fr; gap: 28px; }
    .afr-bento { grid-template-columns: 1fr; }
    .bento-a, .bento-b, .bento-c, .bento-d, .bento-e, .bento-f { grid-column: span 1; }
  }

  /* Entrance: resting state is VISIBLE (safe for capture / print / no-JS).
     Hidden only while .afr-preload is present (from first paint until mount). */
  .fade-up { opacity: 1; transform: none; }
  @media (prefers-reduced-motion: no-preference) {

    .afr-preload .fade-up { opacity: 0; transform: translateY(16px); }
    .fade-up.d1 { transition-delay: .04s; } .fade-up.d2 { transition-delay: .12s; }
    .fade-up.d3 { transition-delay: .2s; } .fade-up.d4 { transition-delay: .28s; } .fade-up.d5 { transition-delay: .36s; }
  }
